<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your Results - NeuroPersona</title>
  
  <link rel="stylesheet" href="styles.css">
  
  <style>
    .hidden { display: none; }
    .results-container {
      max-width: 900px;
      margin: 0 auto;
      padding: 40px 20px;
    }
    .personality-box {
      text-align: center;
      padding: 40px;
      background: linear-gradient(135deg, #208099, #1a6a7f);
      color: white;
      border-radius: 12px;
      margin: 30px 0;
    }
    #type-letter {
      font-size: 120px;
      font-weight: 800;
      line-height: 1;
      margin: 0;
    }
    #type-description {
      font-size: 28px;
      margin-top: 10px;
    }
    .confidence-section {
      margin: 30px 0;
      padding: 20px;
      background: #f8f8f6;
      border-radius: 8px;
    }
    .confidence-section h3 {
      margin-top: 0;
      color: #1f3a42;
    }
    #confidence-fill {
      display: block;
      height: 12px;
      background: #208099;
      border-radius: 6px;
      transition: width 0.5s ease;
      margin: 10px 0;
    }
    .interpretation-section {
      margin: 30px 0;
      padding: 20px;
      background: white;
      border-left: 4px solid #208099;
    }
    .domain-score {
      margin: 20px 0;
    }
    .domain-label {
      font-weight: 600;
      margin-bottom: 5px;
      color: #1f3a42;
    }
    .domain-bar {
      height: 12px;
      background: #e0e0e0;
      border-radius: 6px;
      overflow: hidden;
      margin-bottom: 5px;
    }
    .domain-fill {
      height: 100%;
      background: linear-gradient(90deg, #208099, #e68266);
    }
    .domain-value {
      font-size: 12px;
      color: #666;
    }
    .button-group {
      display: flex;
      gap: 15px;
      justify-content: center;
      margin-top: 30px;
    }
  </style>
</head>
<body>
  <header>
    <nav>
      <a href="index.html" class="logo">
        <span>🧠</span>
        <span>NeuroPersona</span>
      </a>
      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="questionnaire.html" class="cta-button">New Assessment</a></li>
      </ul>
    </nav>
  </header>

  <main class="results-container">
    <!-- Loading State -->
    <div id="loading-state">
      <div style="text-align: center; padding: 60px 20px;">
        <div class="spinner"></div>
        <p style="margin-top: 20px; color: #666;">Loading your results...</p>
      </div>
    </div>

    <!-- Results State -->
    <div id="results-state" class="hidden">
      <h1 style="text-align: center; margin-bottom: 10px;">Your Personality Assessment Results</h1>
      
      <div class="personality-box">
        <div id="type-letter">?</div>
        <div id="type-description">Loading...</div>
      </div>
      
      <div class="confidence-section">
        <h3>Confidence Score</h3>
        <div id="confidence-fill" style="width: 0%"></div>
        <div style="text-align: center; font-weight: 600;">
          <span id="confidence-value">0</span>%
        </div>
      </div>
      
      <div class="interpretation-section">
        <h3>Your Interpretation</h3>
        <p id="interpretation-text">Processing your assessment...</p>
      </div>
      
      <div>
        <h3>Domain Scores</h3>
        <div id="domain-scores-container"></div>
      </div>
      
      <div class="button-group">
        <a href="questionnaire.html" class="btn btn-primary">Take Another Assessment</a>
        <a href="index.html" class="btn btn-secondary">Back to Home</a>
      </div>
    </div>

    <!-- Error State -->
    <div id="error-state" class="hidden"></div>
  </main>

  <!-- results.js is inline above -->
</body>
</html>
