<!DOCTYPE html>
<html lang="en">
<head>
    <script>
      const API_BASE_URL = 'https://neuropersona.onrender.com';
    </script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assessment Results</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f7fa;
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 900px;
            margin: 0 auto;
        }
        
        .results-section {
            background: white;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            padding: 40px;
            margin-bottom: 20px;
        }
        
        .header {
            text-align: center;
            margin-bottom: 30px;
            border-bottom: 2px solid #f0f0f0;
            padding-bottom: 20px;
        }
        
        .header h1 {
            color: #333;
            font-size: 32px;
            margin-bottom: 10px;
        }
        
        .header p {
            color: #666;
            font-size: 16px;
        }
        
        .personality-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            border-radius: 12px;
            margin: 20px 0;
            text-align: center;
        }
        
        .personality-card h2 {
            font-size: 24px;
            margin-bottom: 10px;
        }
        
        .personality-type {
            font-size: 48px;
            font-weight: bold;
            margin: 15px 0;
            letter-spacing: 5px;
        }
        
        .confidence-score {
            font-size: 14px;
            margin-top: 15px;
            opacity: 0.9;
        }
        
        .scores-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 20px;
            margin: 30px 0;
        }
        
        .score-card {
            background: #f9f9f9;
            border: 2px solid #f0f0f0;
            border-radius: 10px;
            padding: 20px;
            text-align: center;
            transition: all 0.3s ease;
        }
        
        .score-card:hover {
            border-color: #667eea;
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.2);
        }
        
        .score-label {
            color: #666;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            margin-bottom: 10px;
        }
        
        .score-value {
            color: #667eea;
            font-size: 28px;
            font-weight: bold;
        }
        
        .score-meter {
            height: 4px;
            background: #e0e0e0;
            border-radius: 2px;
            margin-top: 10px;
            overflow: hidden;
        }
        
        .score-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            width: 50%;
        }
        
        .interpretation-section {
            background: #f9f9f9;
            border-left: 4px solid #667eea;
            padding: 20px;
            border-radius: 6px;
            margin: 30px 0;
        }
        
        .interpretation-title {
            color: #333;
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 15px;
        }
        
        .interpretation-text {
            color: #555;
            line-height: 1.6;
            font-size: 14px;
        }
        
        .traits-section {
            margin: 30px 0;
        }
        
        .traits-title {
            color: #333;
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 15px;
        }
        
        .trait-badges {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }
        
        .trait-badge {
            background: #e3f2fd;
            color: #1976d2;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 500;
        }
        
        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 30px;
            justify-content: center;
        }
        
        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }
        
        .btn-secondary {
            background: #f0f0f0;
            color: #333;
        }
        
        .btn-secondary:hover {
            background: #e0e0e0;
        }
        
        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
        }
        
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        @media (max-width: 768px) {
            .results-section {
                padding: 20px;
            }
            
            .personality-card {
                padding: 20px;
            }
            
            .personality-type {
                font-size: 36px;
            }
            
            .button-group {
                flex-direction: column;
            }
            
            .btn {
                width: 100%;
            }
        }
        
        @media print {
            body {
                background: white;
            }
            
            .button-group {
                display: none;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="results-section">
            <div class="header">
                <h1>Your Personality Assessment Results</h1>
                <p>Based on your responses to the 35-question questionnaire</p>
            </div>
            
            <div id="loading" class="loading">
                <div class="spinner"></div>
                <p>Loading your results...</p>
            </div>
            
            <div id="results" style="display: none;">
                <div class="personality-card" id="personalityCard">
                    <h2 id="personalityName">Type Unknown</h2>
                    <div class="personality-type" id="personalityType">-</div>
                    <div class="confidence-score">
                        Confidence: <span id="confidenceScore">0%</span>
                    </div>
                </div>
                
                <div>
                    <h3 style="color: #333; margin-bottom: 20px;">Your Domain Scores</h3>
                    <div class="scores-grid" id="scoresGrid"></div>
                </div>
                
                <div class="interpretation-section">
                    <div class="interpretation-title">About Your Personality Type</div>
                    <div class="interpretation-text" id="interpretationText">
                        Loading interpretation...
                    </div>
                </div>
                
                <div class="traits-section">
                    <div class="traits-title">Key Traits</div>
                    <div class="trait-badges" id="traitsContainer"></div>
                </div>
                
                <div class="button-group">
                    <button class="btn btn-primary" onclick="downloadPDF()">
                        Download PDF Report
                    </button>
                    <button class="btn btn-secondary" onclick="location.href='/'">
                        Start New Assessment
                    </button>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        async function loadResults() {
            const params = new URLSearchParams(window.location.search);
            const assessmentId = params.get('id');
            
            if (!assessmentId) {
                document.getElementById('loading').innerHTML = 'No assessment ID provided.';
                return;
            }
            
            try {
                const response = await fetch(`/api/results/${assessmentId}`);
                
                if (!response.ok) {
                    throw new Error('Failed to load results');
                }
                
                const data = await response.json();
                
                if (data.status === 'success') {
                    displayResults(data);
                } else {
                    document.getElementById('loading').innerHTML = 'Error loading results.';
                }
            } catch (error) {
                console.error('Error loading results:', error);
                document.getElementById('loading').innerHTML = 'Failed to load results. Please try again.';
            }
        }
        
        function displayResults(data) {
            const personality = data.personality;
            const results = data.results;
            const interpretation = data.interpretation;
            
            document.getElementById('personalityName').textContent = personality.type_description || 'Unknown Type';
            document.getElementById('personalityType').textContent = personality.personality_type;
            document.getElementById('confidenceScore').textContent = 
                (personality.confidence_score * 100).toFixed(1) + '%';
            
            const domainNames = {
                'R': 'Resilience',
                'S': 'Social Awareness',
                'C': 'Conscientiousness',
                'A': 'Adaptability',
                'O': 'Openness',
                'E': 'Extroversion'
            };
            
            const scoresGrid = document.getElementById('scoresGrid');
            scoresGrid.innerHTML = '';
            
            Object.entries(results.corrected_domain_scores).forEach(([domain, score]) => {
                const scoreCard = document.createElement('div');
                scoreCard.className = 'score-card';
                
                const fillWidth = (score / 10) * 100;
                
                scoreCard.innerHTML = `
                    <div class="score-label">${domainNames[domain] || domain}</div>
                    <div class="score-value">${score.toFixed(1)}</div>
                    <div class="score-meter">
                        <div class="score-fill" style="width: ${fillWidth}%"></div>
                    </div>
                `;
                
                scoresGrid.appendChild(scoreCard);
            });
            
            document.getElementById('interpretationText').textContent = interpretation || 'Interpretation loading...';
            
            const traitsContainer = document.getElementById('traitsContainer');
            traitsContainer.innerHTML = '';
            
            if (personality.key_traits && Array.isArray(personality.key_traits)) {
                personality.key_traits.forEach(trait => {
                    const badge = document.createElement('div');
                    badge.className = 'trait-badge';
                    badge.textContent = trait;
                    traitsContainer.appendChild(badge);
                });
            }
            
            document.getElementById('loading').style.display = 'none';
            document.getElementById('results').style.display = 'block';
        }
        
        function downloadPDF() {
            const element = document.getElementById('results');
            const opt = {
                margin: 10,
                filename: 'personality-assessment-results.pdf',
                image: { type: 'jpeg', quality: 0.98 },
                html2canvas: { scale: 2 },
                jsPDF: { orientation: 'portrait', unit: 'mm', format: 'a4' }
            };
            html2pdf().set(opt).from(element).save();
        }
        
        window.addEventListener('load', loadResults);
    </script>
</body>
</html>
