<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Personality Assessment - NeuroPersona</title>
  
  <link rel="stylesheet" href="styles.css">
  
  <style>
    .hidden { display: none; }
    .question-item {
      margin-bottom: 40px;
      padding: 20px;
      background: #fff;
      border-radius: 8px;
    }
    .question-item label {
      display: block;
      font-weight: 600;
      margin-bottom: 15px;
      color: #1f3a42;
    }
    .question-slider {
      width: 100%;
      height: 6px;
      border-radius: 3px;
      background: #e0e0e0;
      outline: none;
      -webkit-appearance: none;
      appearance: none;
    }
    .question-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: #208099;
      cursor: pointer;
    }
    .question-slider::-moz-range-thumb {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: #208099;
      cursor: pointer;
      border: none;
    }
    .range-labels {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: #999;
      margin-top: 5px;
    }
    .progress-container {
      margin: 30px 0;
      padding: 20px;
      background: #f8f8f6;
      border-radius: 8px;
    }
    [data-element="progress-bar"] {
      display: block;
      height: 8px;
      background: #208099;
      border-radius: 4px;
      transition: width 0.3s ease;
      margin-bottom: 10px;
    }
    [data-element="progress-text"] {
      text-align: center;
      font-size: 14px;
      color: #666;
    }
    .button-group {
      display: flex;
      gap: 15px;
      justify-content: center;
      margin-top: 40px;
    }
    #age-error, #sex-error {
      color: #e74c3c;
      font-size: 12px;
      margin-top: 5px;
      display: block;
    }
  </style>
</head>
<body>
  <header>
    <nav>
      <a href="index.html" class="logo">
        <span>🧠</span>
        <span>NeuroPersona</span>
      </a>
      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="index.html#features">Features</a></li>
        <li><a href="index.html#how-it-works">How It Works</a></li>
      </ul>
    </nav>
  </header>

  <main class="container" style="padding: 40px 20px; max-width: 800px; margin: 0 auto;">
    
    <!-- Demographics Section -->
    <section id="demographics-section">
      <h1>Personality Assessment</h1>
      <p style="color: #666; margin-bottom: 30px;">Please provide your demographics to begin the assessment.</p>
      
      <form id="demographics-form">
        <div class="form-group">
          <label for="age">Age:</label>
          <input 
            type="number" 
            id="age" 
            name="age" 
            placeholder="Enter your age (13-120)" 
            required
            style="width: 100%; padding: 10px; border: 1px solid #e0e0e0; border-radius: 4px; font-size: 14px;"
          >
          <span id="age-error"></span>
        </div>
        
        <div class="form-group" style="margin-top: 20px;">
          <label for="sex">Gender:</label>
          <select 
            id="sex" 
            name="sex" 
            required
            style="width: 100%; padding: 10px; border: 1px solid #e0e0e0; border-radius: 4px; font-size: 14px;"
          >
            <option value="">Select Gender</option>
            <option value="M">Male</option>
            <option value="F">Female</option>
            <option value="O">Other</option>
          </select>
          <span id="sex-error"></span>
        </div>
        
        <button 
          type="submit" 
          class="btn btn-primary" 
          style="width: 100%; margin-top: 30px; padding: 12px;"
        >
          Start Assessment
        </button>
      </form>
    </section>

    <!-- Questions Section -->
    <section id="questions-section" class="hidden">
      <h1>Personality Assessment - Questions</h1>
      
      <div class="progress-container">
        <div data-element="progress-bar" style="width: 0%"></div>
        <div data-element="progress-text">0 / 35 answered</div>
      </div>
      
      <form id="assessment-form">
        <div id="questions-container"></div>
        
        <div class="button-group">
          <button type="button" id="back-btn" class="btn btn-secondary">Back</button>
          <button type="button" id="submit-btn" class="btn btn-primary">Submit Assessment</button>
        </div>
      </form>
    </section>
  </main>

  <!-- questionnaire.js is inline above -->
</body>
</html>
